server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Measurement service routes
        - id: measurement-route
          uri: lb://measurement-service
          predicates:
            - Path=/api/v1/quantities/**

        # Auth routes → user-service
        - id: auth-route
          uri: lb://user-service
          predicates:
            - Path=/auth/**

        # OAuth2 routes → user-service
        - id: oauth2-route
          uri: lb://user-service
          predicates:
            - Path=/oauth2/**, /login/**

        # User history routes → user-service
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG